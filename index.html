<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="theme-color" content="#111111">
<meta name="reader-version" content="2.1.0, 2026-09-23">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Reader</title>
<style>
:root{--bg:#111;--ink:#f2efe6;--mut:#9a958a;--acc:#f0b323;--acc-ink:#111;--panel:#1e1e1e;--line:#383838;--hl:rgba(240,179,35,.33);--tts:rgba(90,170,255,.35);--fs:44px;--fw:600;--lh:1.45;--mx:44px;--ff:-apple-system,system-ui,sans-serif}
body[data-theme=black]{--bg:#000;--ink:#fff;--mut:#9a9a9a;--panel:#161616;--line:#333}
body[data-theme=light]{--bg:#fff;--ink:#111;--mut:#666;--acc:#a86f00;--acc-ink:#fff;--panel:#f1f1f1;--line:#d6d6d6;--hl:rgba(255,200,0,.45);--tts:rgba(40,120,255,.25)}
body[data-theme=sepia]{--bg:#f4ecd8;--ink:#35291a;--mut:#7a6a52;--acc:#9a5b00;--acc-ink:#fff;--panel:#e9ddc2;--line:#d3c4a2;--hl:rgba(255,190,0,.45);--tts:rgba(40,120,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:2px solid var(--line);border-radius:14px;min-height:60px;min-width:60px;padding:0 18px;font-size:21px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.small{min-height:48px;font-size:18px;padding:0 14px}
button.wide{width:100%;margin:8px 0}
input,select,textarea{background:var(--bg);border:2px solid var(--line);border-radius:12px;font-size:21px;padding:12px 14px;min-height:56px;width:100%}
textarea{min-height:120px;resize:vertical}
[hidden]{display:none!important}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}
.row input{flex:1;min-width:0}

/* library */
#lib{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 40px)}
#lib header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
#lib h1{font-size:40px;margin:0;flex:1}
#syncdot{font-size:16px;color:var(--mut);background:none;border-radius:99px;font-weight:500}
#today{font-size:18px;margin:0 0 10px}
.filters{display:flex;gap:10px;margin-bottom:12px}
.filters input{flex:1;min-width:0}
.filters select{width:auto}
#shelves{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{min-height:48px;border-radius:99px;font-size:18px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 22px}
.card .cover{display:block;width:100%;aspect-ratio:2/3;padding:0;border-radius:10px;overflow:hidden;position:relative;background:var(--panel)}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;font-size:22px;line-height:1.25;text-align:center;font-weight:700;background:linear-gradient(160deg,var(--panel),var(--line))}
.card .prog{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(0,0,0,.35)}
.card .prog i{display:block;height:100%;background:var(--acc)}
.card.away .cover{opacity:.55}
.card .meta{display:flex;gap:6px;align-items:flex-start;margin-top:10px}
.card .go{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;min-height:0;display:block}
.card .t{font-size:21px;font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .a{font-size:17px;color:var(--mut);font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:16px;color:var(--mut);font-weight:500;margin-top:3px}
.card .dots{min-width:48px;min-height:48px;padding:0;font-size:16px;letter-spacing:1px}
#empty{font-size:24px;color:var(--mut);line-height:1.5;max-width:32em}
#busy{font-size:22px;color:var(--acc);margin:12px 0}

/* reading */
#page{position:fixed;inset:0;overflow:hidden;padding:calc(env(safe-area-inset-top) + 30px) var(--mx) calc(env(safe-area-inset-bottom) + 48px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.selectable #flow{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
#flow{column-fill:auto;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);font-weight:var(--fw);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;text-align:left;will-change:transform}
body.justify #flow{text-align:justify}
#flow *{font-size:inherit;line-height:inherit;font-family:inherit;color:inherit;background:none!important;max-width:100%;border-color:var(--line)}
#flow p,#flow div{margin:0 0 .55em;text-indent:0}
#flow h1,#flow h2,#flow h3,#flow h4,#flow h5,#flow h6{font-size:1.2em;line-height:1.25;margin:.2em 0 .6em;font-weight:800;break-after:avoid}
#flow b,#flow strong{font-weight:800}
#flow img{display:block;max-width:100%;max-height:calc(var(--ph) - 1em);height:auto;width:auto;margin:0 auto .5em;break-inside:avoid;object-fit:contain}
#flow a{color:inherit;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:4px}
#flow pre{white-space:pre-wrap}
#flow blockquote{margin:0 0 .55em 1em}
#flow ul,#flow ol{padding-left:1.2em;margin:0 0 .55em}
#flow table{border-collapse:collapse}
#flow td,#flow th{padding:0 .3em}
#flow sup,#flow sub{font-size:.6em;line-height:0}
#flow hr{border:0;height:auto;margin:.4em 0;text-align:center;break-after:avoid}
#flow hr::after{content:"* * *";color:var(--mut)}
#flow mark{color:inherit}
#flow mark.hl{background:var(--hl)!important;border-radius:4px}
#flow mark.hl.has-note{text-decoration:underline dotted var(--acc) 3px;text-underline-offset:6px}
#flow mark.found{background:var(--tts)!important}
::highlight(tts){background-color:var(--tts)}
::highlight(found){background-color:var(--tts)}
#flow.fixed{columns:auto}
#flow .fx{position:relative;width:100%;height:100%;overflow:hidden;margin:0}
#flow .fx img{width:100%;height:100%;max-height:none;object-fit:contain;margin:0}
#flow .fx iframe{position:absolute;top:0;border:0;transform-origin:0 0;pointer-events:none;background:#fff}

#status{position:fixed;left:var(--mx);right:var(--mx);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:16px;font-size:18px;color:var(--mut);pointer-events:none;font-variant-numeric:tabular-nums;font-family:-apple-system,system-ui,sans-serif}
#left{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{position:fixed;left:0;right:0;bottom:0;height:5px;pointer-events:none}
#fill{height:100%;background:var(--acc);width:0;opacity:.85}
#autobar{position:fixed;left:0;top:0;height:5px;width:0;background:var(--acc);opacity:.7;pointer-events:none}
#ribbon{position:fixed;top:0;right:calc(var(--mx) / 2 + 6px);width:26px;height:44px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);pointer-events:none}
#lockbadge{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 4px);left:50%;transform:translateX(-50%);font-size:16px;color:var(--mut);border:2px solid var(--line);border-radius:99px;padding:2px 14px;pointer-events:none}
body.locked #lockbadge{display:block}
#backbtn{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 50px);box-shadow:0 6px 20px rgba(0,0,0,.35)}

#tools{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;background:var(--panel);border-bottom:2px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35);font-family:-apple-system,system-ui,sans-serif}
.trow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.trow button{flex:1 1 auto}
.slide{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.slide input{flex:1;min-height:44px;padding:0;border:0;background:none;accent-color:var(--acc)}
#sliderlab{font-size:20px;min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
.info{font-size:18px;color:var(--mut);line-height:1.45}
.info b{color:var(--ink)}

#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 60px);display:flex;gap:8px;padding:10px;background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-family:-apple-system,system-ui,sans-serif}

/* panels */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);border-left:2px solid var(--line);display:flex;flex-direction:column;font-family:-apple-system,system-ui,sans-serif;font-size:21px;line-height:1.4;box-shadow:-10px 0 40px rgba(0,0,0,.35)}
.shead{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;border-bottom:2px solid var(--line)}
.shead h2{flex:1;margin:0;font-size:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px calc(env(safe-area-inset-bottom) + 30px)}
.sbody h3{font-size:22px;margin:22px 0 8px}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:14px 8px;font-weight:500;min-height:60px}
.item.cur{color:var(--acc);font-weight:800}
.item.result{font-size:19px}
.item.result b{color:var(--acc)}
.mark{display:flex;gap:8px;align-items:center;border-bottom:2px solid var(--line)}
.mark .item{border:0;flex:1;min-width:0}
.quote{font-style:italic}
.notetxt{color:var(--acc);margin-top:4px}
.note-text{font-size:26px;line-height:1.5}
blockquote{margin:0 0 14px;padding-left:14px;border-left:4px solid var(--acc);font-style:italic}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--line)}
.setrow .lab{flex:1}
.setrow .val{min-width:4.2em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.setblock{padding:10px 0;border-bottom:2px solid var(--line)}
.setblock .lab{margin-bottom:8px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.tog{min-width:90px}
.tog.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 10px}
.stats div{background:var(--bg);border-radius:14px;padding:14px}
.stats b{display:block;font-size:30px}
.stats span{color:var(--mut);font-size:18px}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.bar span{font-size:15px;color:var(--mut)}
.sess{display:flex;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:2px solid var(--line);font-size:18px}
.sess span:nth-child(2){flex:1;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details{margin-top:20px}
summary{font-weight:700;min-height:44px;cursor:pointer}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px;font-size:17px}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px 26px;font-size:24px;pointer-events:none;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center;font-family:-apple-system,system-ui,sans-serif;z-index:5}
#toast.on{opacity:1}
</style>
<style id="bookcss"></style>
</head>
<body>

<div id="lib">
  <header>
    <h1>Reader</h1>
    <button id="syncdot" class="small" hidden aria-label="Sync now">Sync on</button>
    <button id="libset">Settings</button>
    <button id="add" class="pri">Add book</button>
  </header>
  <input id="file" type="file" multiple hidden>
  <div class="filters">
    <input id="q" type="search" placeholder="Search your books">
    <select id="sort" aria-label="Sort">
      <option value="recent">Recently read</option>
      <option value="title">Title</option>
      <option value="author">Author</option>
      <option value="added">Recently added</option>
      <option value="progress">Most read</option>
    </select>
  </div>
  <p id="today" class="mut" hidden></p>
  <div id="shelves"></div>
  <div id="busy" hidden></div>
  <div id="list" class="grid"></div>
  <p id="empty" hidden>No books yet. Tap Add book and pick an EPUB, PDF, MOBI, AZW3, comic (CBZ) or text file from Files. Books are kept on this iPad, so they open with no signal.</p>
</div>

<div id="read" hidden>
  <div id="page"><div id="flow"></div></div>
  <div id="autobar" hidden></div>
  <div id="ribbon" hidden></div>
  <div id="lockbadge">Locked: hold the screen for 2 seconds to unlock</div>
  <div id="status"><span id="clock"></span><span id="left"></span><span id="pct"></span></div>
  <div id="bar"><div id="fill"></div></div>
  <button id="backbtn" hidden>Back</button>
  <div id="tools" hidden>
    <div class="trow">
      <button id="t-lib">Library</button>
      <button id="t-toc">Contents</button>
      <button id="t-search">Search</button>
      <button id="t-mark">Bookmark</button>
      <button id="t-marks">Notes</button>
      <button id="t-text">Text</button>
    </div>
    <div class="trow">
      <button id="t-read">Read aloud</button>
      <button id="t-auto">Auto turn</button>
      <button id="t-lock">Lock screen</button>
      <button id="t-more">More</button>
    </div>
    <div class="slide"><input id="slider" type="range" min="0" max="1000" aria-label="Go to a point in the book"><span id="sliderlab"></span></div>
    <div class="info"><b id="booktitle"></b><br><span id="where"></span><br>Remote: <b class="lastkey">press a button to test it</b></div>
  </div>
  <div id="selbar" hidden>
    <button id="sel-hl" class="pri">Highlight</button>
    <button id="sel-note">Note</button>
    <button id="sel-def">Define</button>
    <button id="sel-copy">Copy</button>
    <button id="sel-x">Cancel</button>
  </div>
</div>
<div id="sheets"></div>
<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/formats.js"></script>
<script src="js/sync.js"></script>
<script src="js/reader.js"></script>
<script src="js/library.js"></script>
<script>
'use strict';
let toastT;
function toast(s) {
  const t = $('toast');
  t.textContent = s; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1600);
}
$('t-read').onclick = () => ttsToggle();
$('t-auto').onclick = () => autoToggle();
applySet();
if (location.protocol.startsWith('http') && 'serviceWorker' in navigator && !/nosw/.test(location.search)) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  if (Sync.on()) await Promise.race([Sync.cycle(), wait(3000)]);
  await drawLib();
  const last = store.get('last');
  if (last && !/library/.test(location.hash) && await DB.hasFile(last)) openBookById(last);
})();
</script>
</body>
</html>
